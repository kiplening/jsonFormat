<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="game-2048.css">
    <script>
        (function(){var s=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();
    </script>
</head>
<body>
    <div class="app">
        <header>
            <h1>2048</h1>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">JSON</a>
                    <a href="url-tool.html">URL</a>
                    <a href="game-2048.html" class="active">2048</a>
                </nav>
                <button id="themeToggle" class="btn-theme">☾</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <button id="newGameBtn" class="btn-violet">New Game</button>
                <button id="undoBtn" title="Undo last move (U)">Undo</button>
            </div>
            <div class="toolbar-right">
                <div id="scoreStat" class="stat">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Best</span>
                    <span id="best" class="stat-value">0</span>
                </div>
            </div>
        </div>

        <div class="content">
            <main class="game-main">
                <div class="game">
                    <div id="board" class="board" aria-label="2048 board">
                        <div id="cells" class="cells"></div>
                        <div id="tiles" class="tiles"></div>
                        <div id="overlay" class="overlay">
                            <div id="overlayTitle" class="overlay-title"></div>
                            <div id="overlayText" class="overlay-text"></div>
                            <div class="overlay-actions">
                                <button id="keepGoingBtn" class="btn btn-violet">Keep going</button>
                                <button id="tryAgainBtn" class="btn">Try again</button>
                            </div>
                        </div>
                    </div>

                    <p class="hint">
                        Slide tiles with <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or
                        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, or swipe on a touch screen.
                        Tiles with the same number merge when they touch. Reach <strong>2048</strong>!
                        <span class="hint-keys"><kbd>U</kbd> undo &nbsp;·&nbsp; <kbd>R</kbd> new game</span>
                    </p>
                </div>
            </main>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script src="theme.js"></script>
    <script src="game-2048.js"></script>
</body>
</html>
