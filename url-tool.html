<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Tool</title>
    <link rel="stylesheet" href="url-tool.css">
    <script>
        (function(){var s=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();
    </script>
</head>
<body>
    <div class="app">
        <header>
            <h1>URL Tool</h1>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html">JSON</a>
                    <a href="url-tool.html" class="active">URL</a>
                </nav>
                <button id="themeToggle" class="btn-theme">☾</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <button id="encodeBtn" class="btn-violet">Encode</button>
                <button id="decodeBtn" class="btn-blue">Decode URL</button>
                <div class="toolbar-sep"></div>
                <button id="copyBtn">Copy</button>
                <button id="clearBtn" class="btn-red">Clear</button>
            </div>
        </div>

        <div class="content">
            <main>
                <div class="pane input-pane">
                    <div class="pane-label">Input</div>
                    <textarea id="urlInput" placeholder="Paste your text or URL here…" spellcheck="false"></textarea>
                </div>
                <div class="pane output-pane">
                    <div class="pane-label">Output</div>
                    <textarea id="urlOutput" readonly placeholder="Output will appear here…"></textarea>
                </div>
            </main>

            <!-- URL Info (shown after decode) -->
            <div id="urlInfoSection" class="url-info-section" style="display: none;">
                <div class="url-components-grid">
                    <div class="component-item">
                        <span class="component-label">Protocol</span>
                        <span id="infoProtocol" class="component-value"></span>
                        <button class="btn-copy-mini" data-copy="protocol">Copy</button>
                    </div>
                    <div class="component-item">
                        <span class="component-label">Domain</span>
                        <span id="infoDomain" class="component-value"></span>
                        <button class="btn-copy-mini" data-copy="domain">Copy</button>
                    </div>
                    <div class="component-item">
                        <span class="component-label">Port</span>
                        <span id="infoPort" class="component-value"></span>
                        <button class="btn-copy-mini" data-copy="port">Copy</button>
                    </div>
                    <div class="component-item">
                        <span class="component-label">Path</span>
                        <span id="infoPath" class="component-value"></span>
                        <button class="btn-copy-mini" data-copy="path">Copy</button>
                    </div>
                    <div class="component-item">
                        <span class="component-label">Hash</span>
                        <span id="infoHash" class="component-value"></span>
                        <button class="btn-copy-mini" data-copy="hash">Copy</button>
                    </div>
                </div>

                <div class="params-container">
                    <div class="params-header">Query Parameters</div>
                    <pre id="paramsOutput" class="json-output"></pre>
                </div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script src="theme.js"></script>
    <script src="url-tool.js"></script>
</body>
</html>
