<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function(){var s=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();
    </script>
</head>
<body>
    <div class="app">
        <header>
            <h1>JSON Formatter</h1>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html" class="active">JSON</a>
                    <a href="url-tool.html">URL</a>
                </nav>
                <button id="themeToggle" class="btn-theme">☾</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <button id="formatBtn"  class="btn-violet">Format</button>
                <button id="minifyBtn"  class="btn-blue">Minify</button>
                <button id="validateBtn" class="btn-teal">Validate</button>
                <div class="toolbar-sep"></div>
                <button id="uploadBtn">Upload</button>
                <button id="clearBtn"  class="btn-red">Clear</button>
            </div>
            <div class="toolbar-right">
                <button id="expandAllBtn">▼ Expand</button>
                <button id="collapseAllBtn">▶ Collapse</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search…" />
                    <span id="searchResults" class="search-results"></span>
                </div>
                <div class="toolbar-sep"></div>
                <div class="control-group">
                    <label for="indentSize">Indent</label>
                    <select id="indentSize">
                        <option value="2" selected>2</option>
                        <option value="4">4</option>
                        <option value="tab">Tab</option>
                    </select>
                </div>
                <button id="copyBtn">Copy</button>
                <button id="downloadBtn">Download</button>
            </div>
        </div>

        <main>
            <div class="pane input-pane">
                <textarea id="jsonInput" placeholder="Paste your JSON here…" spellcheck="false"></textarea>
            </div>
            <div class="pane output-pane">
                <pre id="jsonOutput"></pre>
            </div>
        </main>

        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>

    <div id="statusMessage" class="status-message"></div>

    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
